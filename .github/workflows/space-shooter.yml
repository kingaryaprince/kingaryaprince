name: Refresh contribution shooter

on:
  schedule:
    - cron: "43 6 * * *"   # daily, 06:43 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # the action amends its previous commit

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: assets/space-shooter.gif
          strategy: random
          commit-message: "chore: refresh contribution shooter"

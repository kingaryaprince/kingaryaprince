name: tmp token probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query with default GITHUB_TOKEN
        env:
          TOK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > q.json <<'JSON'
          {"query":"query { user(login: \"kingaryaprince\") { name followers(first:1){totalCount} repositoriesContributedTo(first:1, contributionTypes:[COMMIT,ISSUE,PULL_REQUEST,REPOSITORY]){totalCount} contributionsCollection { totalCommitContributions restrictedContributionsCount totalPullRequestReviewContributions } } }"}
          JSON
          echo "----- RESPONSE -----"
          curl -s -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" \
            -d @q.json https://api.github.com/graphql
          echo
